# Test and build Hijack on every push and pull request to main.
# The build is ad-hoc. The uploaded app is evidence of a working build, not a release asset.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin the newest Xcode on the runner. The default (16.x) ships an older swift-format
      # that rejects config keys this repo uses; the Swift toolchain follows the same pick.
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun swift-format --version

      # Blocking since the full format on 2026-10-04 (see docs/swift-format.md).
      - name: Check formatting
        run: make lint

      - name: Run the unit tests
        run: make test

      - name: Build the app (ad-hoc)
        run: make build

      - name: Zip the app
        run: ditto -c -k --keepParent build/Hijack.app build/Hijack.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Hijack.zip
          path: build/Hijack.zip
          retention-days: 7
