# Draft a GitHub release when a v* tag is pushed. No build, no assets.
# make release on the maintainer's Mac signs the build and publishes this draft.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(cat VERSION)"
          if [ "$VERSION" != "$TAG" ]; then
            echo "VERSION is $VERSION. The tag is v$TAG. They must match."
            exit 1
          fi

      - name: Check the release notes file exists
        run: |
          VERSION="$(cat VERSION)"
          test -f "release-notes/v$VERSION.md" || {
            echo "release-notes/v$VERSION.md is missing.";
            exit 1;
          }

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(cat VERSION)"
          gh release create "v$VERSION" --draft --title "Hijack $VERSION" \
            --notes-file "release-notes/v$VERSION.md"
